<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiments & Prototypes</title>
    <meta name="description" content="A collection of experiments, side projects, and interactive prototypes by Girish Rawat.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --accent-color: #6366f1;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out alternate;
            z-index: 0;
            pointer-events: none;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(99, 102, 241, 0.15); /* Indigo */
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(236, 72, 153, 0.15); /* Pink */
            bottom: -200px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 50px) scale(1.1); }
            100% { transform: translate(-50px, -20px) scale(0.9); }
        }

        .container {
            position: relative;
            z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 4rem;
            max-width: 800px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
            transition: box-shadow 0.4s ease;
        }

        .container:hover {
            box-shadow: 0 15px 40px -12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: #0f172a;
            letter-spacing: -1px;
        }

        p.subtitle {
            font-size: 1.25rem;
            font-weight: 300;
            line-height: 1.6;
            color: #475569;
            margin-bottom: 3rem;
            max-width: 600px;
            margin-inline: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2.5rem 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 180px;
            position: relative;
            overflow: hidden;
        }

        .card-state {
            border-bottom: 4px solid #E63F7F;
        }
        
        .card-state:hover {
            border-color: #E63F7F;
            box-shadow: 0 10px 20px -5px rgba(230, 63, 127, 0.2);
        }

        .card .logo {
            margin-bottom: 1rem;
            transition: transform 0.3s ease;
        }

        .card:hover .logo {
            transform: scale(1.05);
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 0, 0, 0.08);
        }
        
        .card:hover::before {
            opacity: 1;
        }

        .card h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
            color: #1e293b;
        }

        .card p {
            font-size: 0.95rem;
            margin-bottom: 0;
            color: #64748b;
            position: relative;
            z-index: 1;
        }

        .back-link {
            position: absolute;
            top: 2.5rem;
            left: 2.5rem;
            z-index: 10;
            color: #64748b;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            padding: 0.75rem 1.25rem;
            border-radius: 99px;
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
        }

        .back-link:hover {
            color: #0f172a;
            background: rgba(255,255,255,0.8);
            border-color: rgba(0,0,0,0.1);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .container { padding: 2.5rem 1.5rem; }
            .back-link { top: 1.5rem; left: 1.5rem; padding: 0.5rem 1rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Home
    </a>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <h1>Experiments & Prototypes</h1>
        <p class="subtitle">A parking space for my ongoing explorations, side projects, and interactive concepts. Things might be broken, and that's okay.</p>
        
        <div class="grid">
            <a href="state/index.html" class="card card-state">
                <svg class="logo" width="60" height="60" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <rect width="120" height="120" rx="30" fill="#EDEDED" />
                    <path d="M 35 35 H 75 V 50 H 90 V 65 H 105 V 105 H 65 V 90 H 50 V 75 H 35 Z" fill="#E63F7F"/>
                </svg>
                <h3>State Product Challenge</h3>
                <p>An exploration into the State ecosystem.</p>
            </a>
            <!-- Add future prototypes here -->
        </div>
    </div>
</body>
</html>
