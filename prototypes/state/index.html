<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --sidebar-bg: #ffffff;
            --text-main: #475569;
            --text-light: #94a3b8;
            --accent-pink: #E63F7F;
            --accent-pink-light: #fdf2f7;
            --border-color: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            margin: 1.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.05);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: calc(100vh - 3rem);
            overflow-y: auto;
        }

        /* Hide scrollbar for a cleaner look */
        .sidebar::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .logo-container {
            margin-bottom: 0.5rem;
            padding-left: 0.5rem;
        }

        .menu-section {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            text-decoration: none;
            color: var(--text-main);
            font-size: 1.05rem;
            font-weight: 500;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .menu-item svg {
            color: #64748b;
        }

        .menu-item:hover {
            background-color: #f8fafc;
        }

        .menu-item.active {
            background-color: var(--accent-pink-light);
            color: var(--accent-pink);
        }

        .menu-item.active svg {
            color: var(--accent-pink);
        }

        hr {
            border: none;
            height: 1px;
            background-color: var(--border-color);
            margin: 0.5rem 1rem;
        }

        /* Recent Chats Section */
        .section-title {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem 0.5rem;
            color: var(--text-main);
            font-size: 1.05rem;
            font-weight: 500;
        }

        .section-title svg {
            color: #64748b;
        }

        .recent-list {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .recent-list a {
            text-decoration: none;
            color: var(--text-light);
            font-size: 0.95rem;
            padding: 0.6rem 1rem 0.6rem 3rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.2s;
        }

        .recent-list a:hover {
            color: var(--text-main);
            background-color: #f8fafc;
            border-radius: 8px;
        }

        .bottom-section {
            margin-top: auto;
        }

    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo-container">
            <svg width="60" height="60" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                <rect width="120" height="120" rx="28" fill="#e2e8f0" />
                <path d="M 35 35 H 75 V 50 H 90 V 65 H 105 V 105 H 65 V 90 H 50 V 75 H 35 Z" fill="#E63F7F"/>
            </svg>
        </div>
        
        <div class="menu-section">
            <a href="#" class="menu-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
                    <path d="M9 9v6"></path><path d="M12 7v10"></path><path d="M15 10v4"></path>

                <span>New Chat</span>

            <a href="#" class="menu-item active">

                    <polyline points="2 12 12 17 22 12"></polyline>
                    <polyline points="2 17 12 22 22 17"></polyline>

                <span>Themes</span>

            <a href="#" class="menu-item">

                    <circle cx="12" cy="12" r="10"></circle>

        <div class="menu-section">

                    <line x1="12" y1="5" x2="12" y2="19"></line>

                </svg>
                <span>Create Motion</span>
            </a>
            <a href="#" class="menu-item">

                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span>Notifications</span>
            </a>
            <a href="#" class="menu-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Profile</span>
            </a>
        </div>
        
        <hr>
        
        <div class="menu-section">
            <div class="section-title">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>Recent Chats</span>
            </div>
            <div class="recent-list">
                <a href="#">Give me a brief summa...</a>
                <a href="#">I want to create a new...</a>
                <a href="#">i care about improving...</a>
            </div>
        </div>
        
        <hr>
        
        <div class="menu-section bottom-section">
            <a href="#" class="menu-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
                <span>Give Feedback</span>
            </a>
            <a href="#" class="menu-item">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                    <line x1="12" y1="2" x2="12" y2="12"></line>
                </svg>
                <span>Logout</span>
            </a>
        </div>
    </nav>

    <!-- Main Content Area Placeholder -->
    <main style="flex: 1; padding: 2rem; display: flex; align-items: center; justify-content: center;">
        <div style="text-align: center; color: #94a3b8;">
            <p>Main content area</p>
        </div>
    </main>

</body>
</html>
